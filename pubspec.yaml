name: mila_invest_workspace
description: Monorepo root of the MILA Invest Flutter application.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.11.5

workspace:
  - packages/development/lint
  - packages/features/generic/app_cross/constants
  - packages/features/generic/app_cross/module
  - packages/features/generic/app_cross/typing
  - packages/features/generic/authentication/constants
  - packages/features/generic/authentication/typing
  - packages/shared/fake_backend
  - packages/shared/navigator
  - packages/shared/network
  - packages/shared/typing
  - packages/shared/utilities
  - packages/ui/components/packages/allocation_donut
  - packages/ui/components/packages/country_chip
  - packages/ui/components/packages/disclaimer_banner
  - packages/ui/components/packages/empty_state
  - packages/ui/components/packages/error_state
  - packages/ui/components/packages/instrument_tile
  - packages/ui/components/packages/money_text
  - packages/ui/components/packages/order_summary
  - packages/ui/components/packages/price_change
  - packages/ui/components/packages/price_chart
  - packages/ui/components/packages/stat_tile
  - packages/ui/design_system

dev_dependencies:
  melos: 7.3.0
  yaml: 3.1.3

melos:
  name: mila_invest
  command:
    bootstrap:
      enforceLockfile: true
  scripts:
    lint: flutter analyze --no-fatal-infos
    dartFormat: melos exec -c 1 -- dart format . --line-length 80
    dartFix: melos exec -c 1 -- dart fix --apply
    pubGet: melos exec -c 1 -- flutter pub get
    test: melos exec --dir-exists=test -- flutter test
