name: design_system
description: Tokens, temas y primitivas de MILA Invest.
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.11.5

dependencies:
  cupertino_icons: 1.0.8
  flutter:
    sdk: flutter
  flutter_riverpod: 2.6.1
  shimmer: 3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lint: 0.1.0

flutter:
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
